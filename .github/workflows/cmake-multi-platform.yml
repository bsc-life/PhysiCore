name: CMake Build on Ubuntu, Windows, and MacOS

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            preset: gcc-release-no-cuda
          - os: ubuntu-latest
            preset: llvm-release-no-cuda
          - os: macos-latest
            preset: appleclang-release
          - os: windows-latest
            preset: msvc-release-no-cuda

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install libomp
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libomp-dev

    - name: Install CUDA Toolkit
      uses: ./.github/actions/cuda-toolkit

    - name: Build and test with CMake
      uses: ./.github/actions/setup-build-env
      with:
        os: ${{ matrix.os }}
        workflow-preset: ${{ matrix.preset }}
