name: CMake Build on Ubuntu, Windows, and MacOS

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            preset: gcc-release-no-cuda
            triplet: x64-linux
          - os: ubuntu-latest
            preset: llvm-release-no-cuda
            triplet: x64-linux
          - os: macos-latest
            preset: appleclang-release
            triplet: x64-osx
          - os: windows-latest
            preset: msvc-release-no-cuda
            triplet: x64-windows-static-md

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install libomp
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y libomp-dev

    - name: Install CUDA Toolkit
      uses: ./.github/actions/cuda-toolkit

    - name: Set up vcpkg with cache
      uses: ./.github/actions/setup-vcpkg
      with:
        os: ${{ matrix.os }}
        triplet: ${{ matrix.triplet }}

    - name: Run CMake consuming CMakePreset.json and run vcpkg to build packages
      uses: lukka/run-cmake@v10
      with:
        workflowPreset: ${{ matrix.preset }}
